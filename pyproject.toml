[project]
name = "autowiki"
version = "0.1.0"
description = "Initialize and maintain Karpathy-style LLM wikis in any project."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "networkx>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.24"]
embeddings = ["fastembed>=0.3", "numpy>=1.24"]

[project.scripts]
autowiki = "autowiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autowiki"]
